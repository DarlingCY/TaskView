  function wireTaskForm(layer, task) {
    const form = layer.querySelector('form');
    const values = { status: task ? task.status : 'todo', priority: task ? task.priority : 'medium' };

    // segmented controls
    $$('[data-segment]', layer).forEach(function (group) {
      group.addEventListener('click', function (event) {
        const button = event.target.closest('button[data-value]');
        if (!button) return;
        const key = group.getAttribute('data-segment');
        values[key] = button.getAttribute('data-value');
        $$('button', group).forEach(function (b) {
          const on = b === button;
          b.setAttribute('aria-pressed', String(on));
          const meta = key === 'status' ? STATUS_META[b.getAttribute('data-value')] : PRIORITY_META[b.getAttribute('data-value')];
          b.className = 'flex flex-col items-center gap-1 rounded-lg border px-1.5 py-2 text-[10.5px] font-500 transition-all duration-150 ' +
            (on ? 'border-transparent shadow-sm' : 'border-line bg-surface2/60 text-ink3 hover:border-ink3/40 hover:text-ink2');
          if (on) b.setAttribute('style', 'background:rgb(var(--c-' + meta.tone + ') / .13); color:rgb(var(--c-' + meta.tone + '))');
          else b.removeAttribute('style');
        });
      });
    });

    // project select -> autofill name/path
    const projectSelect = layer.querySelector('[data-field="project"]');
    const pathInput = layer.querySelector('[data-field="project_path"]');
    const nameInput = layer.querySelector('[data-field="project_name"]');
    if (projectSelect) {
      initTselect(projectSelect, { minWidth: 160 });
      projectSelect.addEventListener('change', function () {
        const value = projectSelect.value;
        pathInput.value = value;
        const project = state.projects.find(function (p) { return p.path === value; });
        if (project) nameInput.value = project.name;
      });
    }
    if (pathInput && nameInput) {
      pathInput.addEventListener('input', function () {
        if (projectSelect && projectSelect.value !== pathInput.value) {
          projectSelect.value = '';
          if (projectSelect._tselectSync) projectSelect._tselectSync();
        }
        const raw = pathInput.value.trim();
        if (raw && !nameInput.dataset.touched) {
          const parts = raw.split(/[\\/]/).filter(Boolean);
          nameInput.value = parts[parts.length - 1] || raw;
        }
      });
    }
    if (nameInput) nameInput.addEventListener('input', function () { nameInput.dataset.touched = '1'; });

    // tag preview
    const tagsInput = layer.querySelector('[data-field="tags"]');
    const preview = layer.querySelector('#tag-preview');
    const knownTags = new Set();
    state.tasks.forEach(function (item) { tagsOf(item).forEach(function (tag) { knownTags.add(tag); }); });
    function renderTagPreview() {
      const list = tagsInput.value.split(',').map(function (t) { return t.trim(); }).filter(Boolean);
      if (!list.length) { preview.innerHTML = ''; return; }
      preview.innerHTML = list.map(function (tag) {
        return '<span class="chip ' + (knownTags.has(tag) ? 'border-brand/40 text-brand' : '') + '">#' + esc(tag) + '</span>';
      }).join('');
    }
    if (tagsInput) tagsInput.addEventListener('input', renderTagPreview);
    renderTagPreview();

    // delete action inside the editor
    const deleteBtn = layer.querySelector('[data-delete-task]');
    if (deleteBtn && task) {
      deleteBtn.addEventListener('click', function () { closeModal(); confirmDelete(task); });
    }

    function showError(field, message) {
      const el = layer.querySelector('[data-error-for="' + field + '"]');
      if (!el) return;
      el.textContent = message;
      el.classList.toggle('hidden', !message);
      const input = layer.querySelector('[data-field="' + (field === 'lines' ? 'line_start' : field) + '"]');
      if (input) input.classList.toggle('field-invalid', !!message);
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      const submit = layer.querySelector('[data-submit]');
      const get = function (name) { const el = layer.querySelector('[data-field="' + name + '"]'); return el ? el.value.trim() : ''; };

      const title = get('title');
      const lineStartRaw = get('line_start');
      const lineEndRaw = get('line_end');

      showError('title', ''); showError('lines', '');
      if (!title) { showError('title', '请输入简短且明确的任务标题。'); layer.querySelector('[data-field="title"]').focus(); return; }

      let lineStart = null, lineEnd = null;
      if (lineStartRaw) {
        const parsed = Number.parseInt(lineStartRaw, 10);
        if (!Number.isFinite(parsed) || parsed < 0) { showError('lines', '起始行号必须为非负整数。'); return; }
        lineStart = parsed;
      }
      if (lineEndRaw) {
        const parsed = Number.parseInt(lineEndRaw, 10);
        if (!Number.isFinite(parsed) || parsed < 0) { showError('lines', '结束行号必须为非负整数。'); return; }
        lineEnd = parsed;
      }
      if (lineStart !== null && lineEnd !== null && lineEnd < lineStart) {
        showError('lines', '结束行号必须大于或等于起始行号。');
        return;
      }

      const payload = {
        title: title,
        description: get('description') || null,
        status: values.status,
        priority: values.priority,
        file_path: get('file_path') || null,
        line_start: lineStart,
        line_end: lineEnd,
        code_snippet: get('code_snippet') || null,
        agent_notes: get('agent_notes') || null,
        tags: get('tags') || null,
        project_name: get('project_name') || null,
        project_path: get('project_path') || null,
      };

      submit.disabled = true;
      const originalHtml = submit.innerHTML;
      submit.innerHTML = '<span class="inline-flex animate-spin">' + icon('loader', 'h-3.5 w-3.5') + '</span> 保存中…';

      const request = task
        ? api('/api/tasks/' + encodeURIComponent(task.id), { method: 'PATCH', body: payload })
        : api('/api/tasks', { method: 'POST', body: payload });

      request.then(function (data) {
        const saved = unwrapTask(data);
        if (saved) replaceTask(saved);
        closeModal();
        toast(task ? '任务已更新' : '任务已创建', { tone: 'success' });
        if (!task) {
          // jump to the project the task landed in so the user sees it
          if (saved && saved.project_path && saved.project_path !== state.projectPath) {
            state.projectPath = saved.project_path;
          }
        }
        loadAll({ silent: true });
      }).catch(function (err) {
        submit.disabled = false;
        submit.innerHTML = originalHtml;
        toast(err.message || '无法保存任务', { tone: 'error' });
      });
    });
  }

  /* ========================================================== code inspector */
  function openCodeModal(task) {
    const lines = linesOf(task.code_snippet);
    const start = Number(task.line_start) || 0;
    const first = start || 1;
    const sp = splitPath(task.file_path || '');
    const rangeLabel = start ? (task.line_end && task.line_end !== start ? start + '–' + task.line_end : String(start)) : '—';

    let codeHtml;
    if (lines.length) {
      codeHtml = '<div class="relative overflow-hidden rounded-lg border border-line bg-app/60">';
      if (!lines.length) codeHtml += '';
      codeHtml += '<pre class="scroll-thin max-h-[52vh] overflow-auto py-3 font-mono text-[12px] leading-[1.65]"><code>';
      lines.forEach(function (line, index) {
        const lineNo = first + index;
        const highlighted = start && lineNo >= Number(task.line_start) && lineNo <= Number(task.line_end || task.line_start);
        codeHtml +=
          '<span class="flex' + (highlighted ? ' bg-brand/10' : '') + '">' +
            '<span class="sticky left-0 w-12 shrink-0 select-none border-r border-line-2 px-2 text-right text-[11px] ' + (highlighted ? 'bg-brand/12 text-brand' : 'bg-app/40 text-ink3') + '">' + lineNo + '</span>' +
            '<span class="whitespace-pre px-3 ' + (highlighted ? 'text-ink' : 'text-ink2') + '">' + (esc(line) || ' ') + '</span>' +
          '</span>';
      });
      codeHtml += '</code></pre></div>';
    } else {
      codeHtml =
        '<div class="grid place-items-center rounded-lg border border-dashed border-line px-6 py-10 text-center">' +
          '<div><div class="mx-auto mb-2 grid h-9 w-9 place-items-center rounded-lg bg-surface3 text-ink3">' + icon('fileCode', 'h-4 w-4') + '</div>' +
          '<p class="text-[12.5px] font-500 text-ink2">暂无代码片段</p>' +
          '<p class="mt-0.5 text-[11.5px] text-ink3">打开此任务并粘贴相关代码行，为智能体提供完整上下文。</p></div>' +
        '</div>';
    }

    openModal({
      size: 'max-w-3xl',
      titleId: 'code-modal-title',
      html:
        '<header class="flex shrink-0 items-start gap-3 border-b border-line-2 px-5 py-3.5">' +
          '<span class="mt-0.5 grid h-7 w-7 shrink-0 place-items-center rounded-lg bg-brand/12 text-brand">' + icon('fileCode', 'h-4 w-4') + '</span>' +
          '<div class="min-w-0 flex-1">' +
            '<h2 id="code-modal-title" class="truncate font-display text-[14px] font-600 tracking-tight text-ink">' + esc(task.title) + '</h2>' +
            '<p class="mt-0.5 truncate font-mono text-[11.5px] text-ink3">' + esc(task.file_path || '无文件路径') + '</p>' +
          '</div>' +
          '<div class="flex shrink-0 items-center gap-1.5">' +
            '<button type="button" data-copy-code class="inline-flex items-center gap-1.5 rounded-lg border border-line bg-surface2 px-2.5 py-1.5 text-[12px] font-500 text-ink2 transition-all hover:border-brand/40 hover:text-brand active:scale-95">' + icon('copy', 'h-3.5 w-3.5') + '复制</button>' +
            '<button type="button" data-modal-close class="icon-btn" aria-label="关闭">' + icon('x', 'h-4 w-4') + '</button>' +
          '</div>' +
        '</header>' +
        '<div class="flex-1 space-y-3.5 overflow-y-auto scroll-thin px-5 py-4">' +
          '<div class="flex flex-wrap items-center gap-1.5">' +
            '<span class="chip">' + icon('fileCode', 'h-3 w-3') + (sp.name || '—') + '</span>' +
            '<span class="chip">行号 ' + esc(rangeLabel) + '</span>' +
            (task.project_name ? '<span class="chip"><span class="h-1.5 w-1.5 rounded-full bg-brand/70"></span>' + esc(task.project_name) + '</span>' : '') +
            '<span class="ml-auto text-[11px] text-ink3">' + lines.length + ' 行</span>' +
          '</div>' +
          codeHtml +
          (task.agent_notes
            ? '<div class="rounded-lg border border-ai/25 bg-ai/8 px-3 py-2.5">' +
                '<p class="mb-1 flex items-center gap-1.5 text-[10px] font-700 uppercase tracking-[.14em] text-ai/85">' + icon('sparkles', 'h-3 w-3') + '智能体备注</p>' +
                '<p class="whitespace-pre-line text-[12px] leading-relaxed text-ink2">' + esc(task.agent_notes) + '</p>' +
              '</div>'
            : '') +
        '</div>' +
        '<footer class="flex shrink-0 items-center justify-end gap-2 border-t border-line-2 bg-surface2/40 px-5 py-3">' +
          '<button type="button" data-modal-close class="rounded-lg border border-line bg-surface2 px-3.5 py-2 text-[12.5px] font-500 text-ink2 transition-colors hover:text-ink">关闭</button>' +
          '<button type="button" data-open-task class="inline-flex items-center gap-1.5 rounded-lg bg-gradient-to-b from-brand to-brand/85 px-4 py-2 text-[12.5px] font-600 text-white shadow-brand transition-all hover:brightness-110 active:scale-95">' + icon('pencil', 'h-3.5 w-3.5') + '编辑任务</button>' +
        '</footer>',
      onMount: function (l) {
        const copyBtn = l.querySelector('[data-copy-code]');
        if (copyBtn) {
          copyBtn.addEventListener('click', function () { copyText(task.code_snippet || ''); });
        }
        const editBtn = l.querySelector('[data-open-task]');
        if (editBtn) editBtn.addEventListener('click', function () { closeModal(); openTaskModal(task); });
        $$('[data-modal-close]', l).forEach(function (btn) { btn.addEventListener('click', function () { closeModal(); }); });
      },
    });
  }

  function copyText(text) {
    if (!text) { toast('暂无内容可复制', { tone: 'warn' }); return; }
    const done = function () { toast('代码已复制到剪贴板', { tone: 'success' }); };
    const failed = function () { toast('无法访问剪贴板', { tone: 'error' }); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text, done, failed); });
    } else {
      fallbackCopy(text, done, failed);
    }
  }

  function fallbackCopy(text, done, failed) {
    try {
      const area = document.createElement('textarea');
      area.value = text;
      area.setAttribute('readonly', '');
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(area);
      if (ok) done(); else failed();
    } catch (e) { failed(); }
  }

  /* ==================================================================== delete */
  function confirmDelete(task) {
    openModal({
      size: 'max-w-md',
      titleId: 'delete-modal-title',
      html:
        '<div class="p-5">' +
          '<div class="flex items-start gap-3">' +
            '<span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-urgent/12 text-urgent">' + icon('trash', 'h-[18px] w-[18px]') + '</span>' +
            '<div class="min-w-0">' +
              '<h2 id="delete-modal-title" class="font-display text-[15px] font-600 tracking-tight text-ink">删除此任务？</h2>' +
              '<p class="mt-1.5 text-[12.5px] leading-relaxed text-ink2">“' + esc(task.title) + '”将被永久删除。操作后可立即撤销。</p>' +
            '</div>' +
          '</div>' +
          '<div class="mt-5 flex justify-end gap-2">' +
            '<button type="button" data-modal-close class="rounded-lg border border-line bg-surface2 px-3.5 py-2 text-[12.5px] font-500 text-ink2 transition-colors hover:text-ink">保留</button>' +
            '<button type="button" data-confirm-delete class="rounded-lg bg-urgent px-4 py-2 text-[12.5px] font-600 text-white shadow-lg transition-all hover:brightness-110 active:scale-95">删除任务</button>' +
          '</div>' +
        '</div>',
      onMount: function (l) {
        $$('[data-modal-close]', l).forEach(function (b) { b.addEventListener('click', closeModal); });
        l.querySelector('[data-confirm-delete]').addEventListener('click', function () { closeModal(); performDelete(task); });
      },
    });
  }

  async function performDelete(task) {
    const snapshot = Object.assign({}, task);
    const index = state.tasks.findIndex(function (t) { return t.id === task.id; });
    if (index !== -1) state.tasks.splice(index, 1);
    renderAll();
    try {
      await api('/api/tasks/' + encodeURIComponent(task.id), { method: 'DELETE' });
      refreshStats();
      refreshSidebarCounts();
      toast('任务已删除', {
        tone: 'info',
        actionLabel: '撤销',
        onAction: async function () {
          try {
            const payload = {
              title: snapshot.title,
              description: snapshot.description,
              status: snapshot.status,
              priority: snapshot.priority,
              file_path: snapshot.file_path,
              line_start: snapshot.line_start,
              line_end: snapshot.line_end,
              code_snippet: snapshot.code_snippet,
              agent_notes: snapshot.agent_notes,
              tags: snapshot.tags,
              project_name: snapshot.project_name,
              project_path: snapshot.project_path,
            };
            const restored = unwrapTask(await api('/api/tasks', { method: 'POST', body: payload }));
            if (restored) replaceTask(restored);
            toast('任务已恢复', { tone: 'success' });
            loadAll({ silent: true });
          } catch (err) {
            toast(err.message || '无法恢复任务', { tone: 'error' });
          }
        },
      });
    } catch (err) {
      if (index !== -1) state.tasks.splice(index, 0, snapshot);
      renderAll();
      toast(err.message || '无法删除任务', { tone: 'error' });
    }
  }

  /* ==================================================================== theme */
  function applyTheme() {
    const dark = state.theme === 'dark';
    document.documentElement.classList.toggle('dark', dark);
    document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    const btn = $('#theme-toggle');
    btn.innerHTML = icon(dark ? 'sun' : 'moon');
    btn.title = dark ? '切换为浅色主题' : '切换为深色主题';
  }
  function toggleTheme() {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('taskview.theme', state.theme); } catch (e) {}
    applyTheme();
  }

  /* ================================================================== layout */
  function setView(view) {
    if (state.view === view) return;
    state.view = view;
    boardEl.hidden = view !== 'board';
    listEl.hidden = view !== 'list';
    // `#main-scroll` is the horizontal scroll container for the board, so it must
    // never also scroll vertically — each view owns its own scrolling instead.
    mainScroll.classList.toggle('overflow-x-auto', view === 'board');
    mainScroll.classList.remove('overflow-y-auto', 'overflow-auto');
    renderTopbar();
    if (view === 'board') renderBoard(); else renderList();
  }

  function setSidebar(open) {
    state.sidebarOpen = open;
    const sidebar = $('#sidebar');
    const scrim = $('#sidebar-scrim');
    if (open) {
      sidebar.classList.remove('-translate-x-full');
      scrim.classList.remove('opacity-0', 'pointer-events-none');
    } else {
      sidebar.classList.add('-translate-x-full');
      scrim.classList.add('opacity-0', 'pointer-events-none');
    }
  }

  /* ==================================================================== init */
  function init() {
    try {
      const stored = localStorage.getItem('taskview.theme');
      if (stored === 'light' || stored === 'dark') state.theme = stored;
    } catch (e) {}
    applyTheme();

    $('#sidebar-open').addEventListener('click', function () { setSidebar(true); });
    $('#sidebar-close').addEventListener('click', function () { setSidebar(false); });
    $('#sidebar-scrim').addEventListener('click', function () { setSidebar(false); });
    $('#new-task').addEventListener('click', function () { openTaskModal(null); });
    $('#theme-toggle').addEventListener('click', toggleTheme);
    $('#clear-filters').addEventListener('click', function () {
      state.priorities.clear(); state.tags.clear(); renderAll();
    });
    $('#refresh').addEventListener('click', function () { loadAll({ silent: true }); });
    $('#view-board').addEventListener('click', function () { setView('board'); });
    $('#view-list').addEventListener('click', function () { setView('list'); });
    $('#sort').addEventListener('change', function (e) { state.sort = e.target.value; renderAll(); });
    initTselect($('#sort'), { triggerClass: 'tselect-trigger--compact', align: 'end', minWidth: 144 });

    const search = $('#search');
    const onSearch = debounce(function () {
      state.search = search.value;
      renderTopbar();
      if (state.view === 'board') renderBoard(); else renderList();
    }, 110);
    search.addEventListener('input', function () {
      state.search = search.value;
      $('#search-clear').classList.toggle('hidden', !search.value);
      onSearch();
    });
    search.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        state.search = search.value;
        renderTopbar();
        if (state.view === 'board') renderBoard(); else renderList();
      }
    });
    $('#search-clear').addEventListener('click', function () {
      search.value = ''; state.search = '';
      renderAll();
      search.focus();
    });

    // Network status awareness
    window.addEventListener('offline', function () {
      toast('你已处于离线状态 — 在恢复网络前所做更改将无法保存', { tone: 'warn', duration: 6000 });
    });

    document.addEventListener('dragend', function () { clearDropSlot(); clearColumnHighlights(); });

    hydrateIcons(document);
    renderStats();
    renderSidebar();
    renderTopbar();
    boardEl.hidden = false;
    listEl.hidden = true;
    state.view = 'board';
    loadAll();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
